<script>
        // PASTE YOUR ACTUAL ACCESS KEY BETWEEN THE QUOTES BELOW:
        const WEB3FORMS_ACCESS_KEY = e71a64f9-3da5-4fde-b2ff-3463cd3f1c41;

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            const isHidden = modal.classList.contains('hidden');
            if (isHidden) {
                modal.classList.remove('hidden', 'pointer-events-none');
                modal.classList.add('pointer-events-auto');
            } else {
                modal.classList.add('hidden', 'pointer-events-none');
                modal.classList.remove('pointer-events-auto');
            }
        }

        function savePreferences() {
            const country = document.getElementById('user-country').value;
            const lang = document.getElementById('user-lang').value;
            localStorage.setItem('nuvera_country', country);
            localStorage.setItem('nuvera_lang', lang);
            document.getElementById('display-region').innerText = country;
            document.getElementById('display-lang').innerText = lang === 'en' ? 'English' : 'Español';
            toggleModal('region-modal');
        }

        function verifyBatch() {
            const batchNum = document.getElementById('batch-input').value.trim();
            if (!batchNum) {
                alert('Por favor ingrese un número de lote.');
                return;
            }
            alert(`Lote ${batchNum}: Certificado HPLC verificado (>99.3% pureza). Documentación de laboratorio disponible para descarga.`);
        }

        function filterProducts() {
            const query = document.getElementById('catalog-search').value.toLowerCase();
            document.querySelectorAll('#products-grid .product-card').forEach(card => {
                const name = card.getAttribute('data-name');
                if (name.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function handleProductClick(productName) {
            if (!localStorage.getItem('nuvera_registered')) {
                toggleModal('signup-modal');
            } else {
                alert(`Solicitud añadida para: ${productName}. Redirigiendo al área de confirmación de pedido...`);
            }
        }

        function unlockCatalogView(userEmail) {
            localStorage.setItem('nuvera_registered', 'true');
            if (userEmail) localStorage.setItem('nuvera_user_email', userEmail);

            const activeEmail = localStorage.getItem('nuvera_user_email') || 'investigador@lab.com';

            document.getElementById('guest-controls').classList.add('hidden');
            const loggedControls = document.getElementById('logged-controls');
            loggedControls.classList.remove('hidden');
            document.getElementById('logged-user-email').innerText = activeEmail;

            document.getElementById('hero-action-guest').classList.add('hidden');
            document.getElementById('hero-action-user').classList.remove('hidden');

            document.getElementById('access-title').innerText = "Acceso Verificado";
            document.getElementById('access-desc').innerText = `Credenciales activadas para (${activeEmail}). Catálogo completo y solicitudes habilitadas.`;
            const accessBtn = document.getElementById('access-btn');
            accessBtn.innerText = "Ir al Catálogo";
            accessBtn.onclick = () => {
                document.getElementById('catalog-preview').scrollIntoView({ behavior: 'smooth' });
            };
            const accessIconBox = document.getElementById('access-icon-box');
            accessIconBox.classList.remove('border-bio-neon');
            accessIconBox.classList.add('border-bio-green');
            document.getElementById('access-icon').className = "fa-solid fa-lock-open text-bio-green";

            document.querySelectorAll('.product-price').forEach(el => el.classList.remove('hidden'));
            document.querySelectorAll('.locked-price').forEach(el => el.classList.add('hidden'));

            document.querySelectorAll('.product-btn').forEach(btn => {
                btn.innerHTML = '<i class="fa-solid fa-cart-plus mr-2"></i> Añadir a la Solicitud';
                btn.classList.remove('border-gray-700', 'text-gray-300');
                btn.classList.add('bg-bio-neon', 'text-black', 'border-bio-neon', 'hover:bg-white');
            });
        }

        function logoutUser() {
            localStorage.removeItem('nuvera_registered');
            localStorage.removeItem('nuvera_user_email');
            window.location.reload();
        }

        async function handleSignupSubmit(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('signup-btn');
            submitBtn.innerText = 'Enviando Lead...';
            submitBtn.disabled = true;

            const userEmail = document.getElementById('signup-email').value;

            const payload = {
                firstName: document.getElementById('signup-first').value,
                lastName: document.getElementById('signup-last').value,
                email: userEmail,
                phone: document.getElementById('signup-phone').value,
                marketingOptIn: document.getElementById('marketing-optin').checked ? "SI (Aceptó Marketing)" : "NO",
                country: localStorage.getItem('nuvera_country') || 'United States',
                timestamp: new Date().toISOString()
            };

            try {
                await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        access_key: WEB3FORMS_ACCESS_KEY,
                        subject: `🚨 NUEVO LEAD NUVERA: ${payload.firstName} ${payload.lastName}`,
                        from_name: "Nuvera Form Lead System",
                        ...payload
                    })
                });
            } catch (err) {
                console.warn("Error enviando Web3Forms:", err);
            } finally {
                submitBtn.innerText = 'Registrar y Desbloquear';
                submitBtn.disabled = false;

                toggleModal('signup-modal');
                unlockCatalogView(userEmail);

                document.getElementById('catalog-preview').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            toggleModal('login-modal');
            unlockCatalogView(email);
            document.getElementById('catalog-preview').scrollIntoView({ behavior: 'smooth' });
        }

        function handleRepSubmit(e) {
            e.preventDefault();
            alert('Postulación recibida. Un director comercial contactará a su laboratorio.');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedCountry = localStorage.getItem('nuvera_country');
            if (savedCountry) {
                document.getElementById('display-region').innerText = savedCountry;
            }

            if (localStorage.getItem('nuvera_registered')) {
                unlockCatalogView(localStorage.getItem('nuvera_user_email'));
            }
        });
    </script>
</body>
</html>
